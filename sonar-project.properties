sonar.projectKey=hybrid-renderer
sonar.projectName=Hybrid Renderer
sonar.sources=src
sonar.tests=tests

# Don’t scan vendored deps / build outputs / assets
sonar.exclusions=external/**,assets/**,out/**

# C/C++: point to compilation database (path is relative to this file)
sonar.cfamily.compile-commands=build/compile_commands.json